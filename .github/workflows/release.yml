name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt6
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    # DMWSS_NATIVE=OFF: release binaries must run on any x86_64, not just
    # the CI runner's CPU
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDMWSS_NATIVE=OFF

    - name: Build
      run: cmake --build build --config Release --target dmwss

    # Packaged as an AppImage: a single self-contained file that bundles
    # Qt, needs no install, and just runs
    - name: Package AppImage
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
        cp linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-qt
        chmod +x linuxdeploy-plugin-qt

        export PATH="$PWD:/usr/lib/qt6/bin:$PATH"
        export APPIMAGE_EXTRACT_AND_RUN=1
        export ARCH=x86_64
        export QMAKE="$(command -v qmake6 || command -v qmake)"

        mkdir -p AppDir
        ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/dmwss \
          -d packaging/dmwss.desktop -i packaging/icon.png --plugin qt \
          --output appimage

        mv dmwss*.AppImage dmwss-linux-x86_64.AppImage

    - uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: dmwss-linux-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDMWSS_NATIVE=OFF

    - name: Build
      run: cmake --build build --config Release --target dmwss

    - name: Bundle Qt dependencies
      run: windeployqt --release build\Release\dmwss.exe

    - name: Package zip
      run: Compress-Archive -Path build\Release\* -DestinationPath dmwss-windows-x86_64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: dmwss-windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt6
      run: brew install qt@6

    - name: Configure CMake
      run: |
        export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DDMWSS_NATIVE=OFF

    - name: Build
      run: cmake --build build --config Release --target dmwss

    - name: Bundle Qt dependencies
      run: $(brew --prefix qt@6)/bin/macdeployqt build/dmwss.app

    - name: Package zip
      run: ditto -c -k --sequesterRsrc --keepParent build/dmwss.app dmwss-macos-arm64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: release-macos
        path: dmwss-macos-arm64.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: mymindstorm/setup-emsdk@v14

    - name: Build web frontend
      run: sh web/build.sh

    - name: Package zip
      run: cd web/dist && zip -r ../../dmwss-web.zip .

    - uses: actions/upload-artifact@v4
      with:
        name: release-web
        path: dmwss-web.zip

  build-android:
    runs-on: ubuntu-latest
    # Android has more moving parts than the other builds (a host Qt
    # install plus a separate Android-target Qt install, a pinned NDK
    # version, Qt6's CMake Android integration) and is the newest,
    # least-proven part of the pipeline. Its failure should not hold back
    # a release of the four platforms that are already verified working.
    continue-on-error: true
    env:
      QT_VERSION: '6.8.2'
      NDK_VERSION: '27.0.12077973'
      ANDROID_ABI: 'arm64-v8a'
      ANDROID_QT_ARCH: 'android_arm64_v8a'
      ANDROID_PLATFORM: 'android-28'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

    # Qt6's CMake Android support cross-compiles the app with the
    # Android-target Qt libs, but still needs a matching host (Linux) Qt
    # install to run moc/rcc/uic during the build - hence two installs.
    # Neither the action's `qtPath` output nor its QT_ROOT_DIR env var can
    # be trusted here: the outer jurplel/install-qt-action@v4 composite
    # action declares no `outputs:` at all (the inner JS step's setOutput
    # never gets wired up), and QT_ROOT_DIR gets clobbered by the second
    # install since both run in the same job. So each install dir is
    # searched directly for Qt6Config.cmake instead - fully self-contained,
    # no dependency on the action's internal plumbing.
    - name: Install host Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        dir: ${{ github.workspace }}/qt-host

    - name: Install Qt6 for Android
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: linux
        target: android
        arch: ${{ env.ANDROID_QT_ARCH }}
        dir: ${{ github.workspace }}/qt-android

    - name: Configure CMake
      run: |
        NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

        # target=android installs pull in a parallel desktop Qt alongside
        # the android arch dir (aqtinstall's --autodesktop), so the search
        # under qt-android must prefer the android_arm64_v8a match.
        HOST_CONFIG="$(find "$PWD/qt-host" -path '*/lib/cmake/Qt6/Qt6Config.cmake' | head -1)"
        ANDROID_CONFIG="$(find "$PWD/qt-android" -path '*/lib/cmake/Qt6/Qt6Config.cmake' | grep "${{ env.ANDROID_QT_ARCH }}" | head -1)"
        if [ -z "$HOST_CONFIG" ] || [ -z "$ANDROID_CONFIG" ]; then
          echo "Failed to locate Qt6Config.cmake"
          echo "qt-host contents:"; find "$PWD/qt-host" -maxdepth 3
          echo "qt-android contents:"; find "$PWD/qt-android" -maxdepth 3
          exit 1
        fi
        HOST_QT="${HOST_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
        ANDROID_QT="${ANDROID_CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
        echo "Host Qt:    $HOST_QT"
        echo "Android Qt: $ANDROID_QT"

        # The raw NDK toolchain file sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE
        # to ONLY, which restricts find_package() to the NDK sysroot and
        # silently ignores CMAKE_PREFIX_PATH - that's why Qt6 was
        # unreachable even with the correct path above. Qt6 ships its own
        # toolchain file that wraps the NDK one and adds the Qt install to
        # CMAKE_FIND_ROOT_PATH so find_package(Qt6) actually works; this is
        # also what Qt Creator uses for Android CMake builds.
        cmake -B build-android -S . \
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_QT/lib/cmake/Qt6/qt.toolchain.cmake" \
          -DANDROID_NDK_ROOT="$NDK_ROOT" \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
          -DQT_HOST_PATH="$HOST_QT" \
          -DCMAKE_PREFIX_PATH="$ANDROID_QT" \
          -DCMAKE_BUILD_TYPE=Release \
          -DDMWSS_NATIVE=OFF

    # dmwss builds the native library; dmwss_make_apk is the Qt6 CMake
    # Android integration's target that actually invokes androiddeployqt
    # and Gradle to produce the APK
    - name: Build APK
      run: cmake --build build-android --target dmwss_make_apk

    - name: Package APK
      run: |
        APK=$(find build-android -iname "*.apk" | head -1)
        cp "$APK" dmwss-android-arm64.apk

    - uses: actions/upload-artifact@v4
      with:
        name: release-android
        path: dmwss-android-arm64.apk

  publish:
    needs: [ build-linux, build-windows, build-macos, build-web, build-android ]
    if: |
      always() &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true

    # The android glob is intentionally tolerant of no match: that build
    # is allowed to fail (see build-android's continue-on-error) without
    # blocking the release of the other four platforms
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          dmwss-linux-x86_64.AppImage
          dmwss-windows-x86_64.zip
          dmwss-macos-arm64.zip
          dmwss-web.zip
          dmwss-android-arm64.apk
        generate_release_notes: true
