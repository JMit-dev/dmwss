name: Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Qt6
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    # Blargg's test suite (fetched before configure: CMake registers the
    # test ROMs it finds at configure time)
    - name: Fetch test ROMs
      run: git clone --depth 1 https://github.com/retrio/gb-test-roms.git test-roms/gb-test-roms

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dmwss-linux
        path: build/dmwss

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    # Qt 6.5.0 headers use stdext::checked_array_iterator, which newer
    # MSVC STLs removed; 6.8 LTS builds cleanly against them
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.2'

    - name: Fetch test ROMs
      run: git clone --depth 1 https://github.com/retrio/gb-test-roms.git test-roms/gb-test-roms

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dmwss-windows
        path: build/Release/dmwss.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Qt6
      run: brew install qt@6

    - name: Fetch test ROMs
      run: git clone --depth 1 https://github.com/retrio/gb-test-roms.git test-roms/gb-test-roms

    - name: Configure CMake
      run: |
        export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dmwss-macos
        path: build/dmwss
